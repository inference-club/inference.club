name: infra-deploy

# Reconciles the node-level infrastructure with Pulumi: the Hetzner server and
# firewall, the GCS media buckets, host hardening, and k3s + the Argo CD
# bootstrap (infra/). Run it by hand after changing anything under infra/.
#
# Application deploys do NOT go through this workflow. build-and-push commits
# the new image tag to k8s/inference-club/kustomization.yaml and Argo CD, in
# the cluster, rolls it out.
#
# Required GitHub repo secrets:
#   HCLOUD_TOKEN            - Hetzner Cloud API token (Read & Write)
#   PULUMI_ACCESS_TOKEN     - https://app.pulumi.com/account/tokens
#   DEPLOY_SSH_PUBLIC_KEY   - public key registered with Hetzner
#   DEPLOY_SSH_PRIVATE_KEY  - matching private key, base64-encoded
#   GOOGLE_CREDENTIALS      - service-account key JSON for the media buckets
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Only show what would change; apply nothing."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Serialize all infra changes so two runs can't fight over the same VPS.
  group: infra-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci

      - uses: pulumi/actions@v6
        with:
          command: ${{ inputs.preview_only && 'preview' || 'up' }}
          stack-name: prod
          # Create the stack on first run; no-op afterwards.
          upsert: true
          work-dir: infra
          # Read the real state of the server first, so a change made outside
          # Pulumi (a manual resize, say) is seen instead of being re-applied.
          refresh: true
          diff: true
          config-map: |
            inference-club-infra:sshPublicKey: { value: "${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}", secret: true }
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # The hcloud Pulumi provider reads HCLOUD_TOKEN from the env, not
          # from Pulumi config. Same value, different delivery mechanism.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # The repo secret is base64-encoded (single line) and config.ts
          # decodes it. Multi-line secrets aren't reliable through the
          # config-map -> YAML -> Pulumi pipeline, so env is the right
          # transport here.
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # The GCP Pulumi provider (media buckets) reads the service-account
          # key JSON straight from this env var.
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
