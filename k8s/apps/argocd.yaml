# Argo CD manages its own installation from k8s/platform/argocd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/inference-club/inference.club.git
    targetRevision: main
    path: k8s/platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The Argo CD CRDs are too large for client-side apply.
      - ServerSideApply=true
