apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: inference-club, component: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: inference-club, component: postgres }
  template:
    metadata:
      labels: { app: inference-club, component: postgres }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: inference }
            - { name: POSTGRES_USER, value: inference }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "inference", "-d", "inference"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "inference", "-d", "inference"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path-retain
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: inference-club, component: postgres }
spec:
  selector: { app: inference-club, component: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
