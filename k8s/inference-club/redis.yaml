# Cache for rate limiting plus the Celery broker. No persistence, same as it
# was under docker compose: a restart only resets in-flight rate-limit windows
# and queued jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: inference-club, component: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: inference-club, component: redis }
  template:
    metadata:
      labels: { app: inference-club, component: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: inference-club, component: redis }
spec:
  selector: { app: inference-club, component: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
