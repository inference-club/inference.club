# inference.club -> frontend, api.inference.club -> backend. Traefik streams
# responses unbuffered, which the SSE chat endpoints need. HTTP is redirected
# to HTTPS at the Traefik entry point (infra/templates/k3s.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-club
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: inference-club-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [inference.club]
      secretName: inference-club-tls
    - hosts: [api.inference.club]
      secretName: api-inference-club-tls
  rules:
    - host: inference.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 3000 } }
    - host: api.inference.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8001 } }
---
# Response compression. Event streams are excluded so tokens are flushed to
# the client as they are generated.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
