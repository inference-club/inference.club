# Production stack config.
# The only secret Pulumi config needs (sshPublicKey) is set by the GitHub
# Actions workflow at run time from repo secrets, so this file stays in git
# unchanged. Application secrets live as SealedSecrets under k8s/.
config:
  # GCP project holding the media buckets. The provider authenticates via the
  # GOOGLE_CREDENTIALS env var (CI: pulumi-deployer SA key from the repo
  # secret of the same name; locally: gcloud application-default credentials).
  gcp:project: inference-club
  inference-club-infra:domain: inference.club
  inference-club-infra:hcloudLocation: nbg1
  inference-club-infra:serverType: cx33
