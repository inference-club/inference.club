# Local development stack. Backend builds the same image CI ships (so it doubles
# as a smoke test for the prod container) and points at a real Postgres. The
# frontend runs `yarn dev` inside a plain node container with the source
# bind-mounted, so edits hot-reload without rebuilding the image. Caddy is
# intentionally omitted here — exposing each service on its own host port is
# easier for local poking than dealing with TLS/Caddy locally.
#
# To smoke-test the production frontend image, build it directly:
#   docker build -t inference-frontend ./frontend
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inference
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference -d inference"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port 5532 to avoid the IPv6 :5432 binding Docker Desktop holds
      # for dev tooling, and any local Postgres install.
      - "5532:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit catches all outbound email in dev (SMTP on :1025) and shows it in a
  # web UI (http://localhost:8125). Backs the email sign-up confirmation flow —
  # the same role the in-cluster clusters/home/mailpit plays in the home lab.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8125:8025" # web UI (SMTP :1025 stays internal → backend dials mailpit:1025)

  # S3-compatible object storage for media (STT input audio; TTS/image output).
  # RustFS — same engine + version the home cluster runs (MinIO's community
  # images are gone upstream). API on :9100, console on :9101
  # (http://localhost:9101, log in with the access/secret key below).
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_ACCESS_KEY: inferenceclub
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-localdevrustfs}
    volumes:
      - rustfs-data:/data
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # web console

  # One-shot: create the media bucket once RustFS answers (plain S3 API via
  # the AWS CLI — no vendor client needed).
  rustfs-setup:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: inferenceclub
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-localdevrustfs}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do echo 'waiting for rustfs'; sleep 2; done;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket inference-club-media 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket inference-club-media;
      echo 'rustfs bucket ready';
      "

  backend:
    build:
      context: ./backend
      # dev stage = runtime + watchdog (Celery autoreload). CI builds the
      # default `prod` stage.
      target: dev
    # Named so the prober sidecar below can reuse the exact same image.
    image: inferenceclub-backend:dev
    # Hot reload: the source is bind-mounted over the image's /app and Django's
    # runserver autoreloads on every save (the image's gunicorn CMD is only for
    # prod). Rebuild the image (`docker compose build backend`) only when
    # pyproject/poetry.lock change. backend/.env (gitignored) is optional — it
    # only carries GitHub OAuth creds, which local dev doesn't need.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8001"]
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-localdev-not-for-production}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://inference:${POSTGRES_PASSWORD:-localdev}@postgres:5432/inference
      # The compose frontend is published on FRONTEND_PORT (default 3101) —
      # these must reference it, or the browser's cross-origin API calls break.
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3101},http://127.0.0.1:${FRONTEND_PORT:-3101},http://${DEV_HOST:-localhost}:${FRONTEND_PORT:-3101}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3101},http://127.0.0.1:${FRONTEND_PORT:-3101},http://${DEV_HOST:-localhost}:${FRONTEND_PORT:-3101}"
      # Sign-in: email + password only by default (the home-lab auth path).
      # GitHub OAuth is off even if backend/.env has creds; opt back in with
      # AUTH_GITHUB_ENABLED=True in the root .env (the OAuth app's callback
      # must then match this port).
      AUTH_GITHUB_ENABLED: ${AUTH_GITHUB_ENABLED:-False}
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: http://localhost:${FRONTEND_PORT:-3101}/
      SOCIAL_AUTH_LOGIN_ERROR_URL: http://localhost:${FRONTEND_PORT:-3101}/login?oauth_error=1
      PORT: "8001"
      # Local-dev, no-Tailscale agent pathway: trust the address the agent
      # reports at registration and reach it directly (no SOCKS, no hostname
      # rewrite, no auth-key minting). Pairs with an agent run in AGENT_DIRECT
      # mode (see ../inference-club-agent/docker-compose.dev.yml).
      INFERENCE_DIRECT_AGENTS: "True"
      # Keyless web search for the agents' `web_search` tool → the SearXNG
      # running in the home k3s cluster (mcp namespace, NodePort 30808; its JSON
      # API is enabled). Reached directly over the LAN. Override DEV_SEARXNG_URL
      # if a different node IP is handier.
      AGENT_SEARXNG_URL: ${DEV_SEARXNG_URL:-http://192.168.5.173:30808}
      # Shared cache so rate limits + the usage meter are consistent across
      # the gunicorn workers (not per-worker).
      REDIS_URL: redis://redis:6379/0
      # Route media (STT audio etc.) to the local RustFS instead of the
      # container filesystem, so it behaves like prod.
      OBJECT_STORAGE_BUCKET: inference-club-media
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: inferenceclub
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-localdevrustfs}
      OBJECT_STORAGE_REGION: us-east-1
      # Email sign-up flow (home-lab auth path) against Mailpit: confirmation
      # links land in http://localhost:8125.
      AUTH_EMAIL_ENABLED: "True"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: "inference.club <no-reply@inference.club>"
      FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-3101}
    extra_hosts:
      # So the backend can reach a direct-mode agent at
      # http://host.docker.internal:<port>/v1 on Linux too (auto on Docker
      # Desktop for Mac/Windows).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      # Host port 8101 so this can coexist with `manage.py runserver 8001`.
      - "8101:8001"

  # Liveness prober — mirrors the prod `prober` sidecar (see
  # infra/templates/docker-compose.yml.tpl). Hits each active provider's
  # /healthz every 30s and bumps Provider.last_seen_at, so a healthy-but-idle
  # agent doesn't fall outside the 120s online window and show "offline" on
  # the dashboard between requests. Reuses the backend image, different command.
  # No TAILNET_PROXY_URL in dev → it probes agents directly at
  # host.docker.internal:<port> (hence extra_hosts).
  prober:
    image: inferenceclub-backend:dev
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: ["python", "manage.py", "probe_providers", "--interval", "30"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-localdev-not-for-production}
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://inference:${POSTGRES_PASSWORD:-localdev}@postgres:5432/inference
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # Async job execution (PRD 10). The worker runs queued jobs; beat fires the
  # dispatcher tick that claims work and assigns it to providers with free
  # capacity. Both reuse the backend image with the source bind-mounted (no
  # rebuild for code changes) and run under `watchmedo auto-restart`, so they
  # restart on any .py change. Different command, and share the same storage
  # + direct-agent + Redis config the backend uses so a worker can reach agents
  # and persist generated media exactly like the web process.
  celery-worker:
    image: inferenceclub-backend:dev
    volumes:
      - ./backend:/app
    restart: unless-stopped
    # watchmedo restarts the worker whenever a .py file under the mounted
    # source changes (Celery has no reloader of its own).
    command: ["watchmedo", "auto-restart", "--directory=/app", "--pattern=*.py", "--recursive", "--signal=SIGTERM", "--", "celery", "-A", "backend", "worker", "-l", "info", "--concurrency=4"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-localdev-not-for-production}
      DATABASE_URL: postgres://inference:${POSTGRES_PASSWORD:-localdev}@postgres:5432/inference
      REDIS_URL: redis://redis:6379/0
      INFERENCE_DIRECT_AGENTS: "True"
      OBJECT_STORAGE_BUCKET: inference-club-media
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: inferenceclub
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-localdevrustfs}
      OBJECT_STORAGE_REGION: us-east-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    image: inferenceclub-backend:dev
    volumes:
      - ./backend:/app
    restart: unless-stopped
    # -s writes the schedule DB to /tmp; the app user can't write the /app cwd.
    command: ["watchmedo", "auto-restart", "--directory=/app", "--pattern=*.py", "--recursive", "--signal=SIGTERM", "--", "celery", "-A", "backend", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-localdev-not-for-production}
      DATABASE_URL: postgres://inference:${POSTGRES_PASSWORD:-localdev}@postgres:5432/inference
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      # The dev stage runs `yarn install` against the bind-mounted source on
      # first start and then `yarn dev`. The default (`runtime`) stage is what
      # CI ships to prod.
      target: dev
    environment:
      # Browser hits backend on the host's compose port 8101. DEV_HOST (root
      # .env, written by scripts/dev-mobile.sh) swaps in the Mac's LAN IP so
      # phones on the same WiFi can reach the API too; unset = localhost.
      NUXT_PUBLIC_API_BASE: http://${DEV_HOST:-localhost}:8101
      # SSR (inside this container) can't reach localhost:8101 — that's the
      # frontend itself. Reach the backend by its compose service name instead.
      NUXT_API_BASE_INTERNAL: http://backend:8001
      # Nuxt listens on :3000 inside the container but the browser loads the app
      # from the host-published FRONTEND_PORT. Tell Vite's HMR client to connect on the
      # published port; otherwise its WebSocket targets the unpublished :3000,
      # fails, and retries in a loop (sluggish UI + console ws errors). Must
      # match the host side of the port mapping below.
      NUXT_VITE_HMR_CLIENT_PORT: "${FRONTEND_PORT:-3101}"
      # Disable filesystem polling — VirtioFS delivers native fs events, so
      # Vite/chokidar watch without stat-looping the whole tree (which pegged
      # ~2 CPU cores at idle and made HMR/builds crawl). MUST be empty, not
      # "false": these are read as booleans where any non-empty string — even
      # "false" — is truthy and re-enables polling. Empty here also overrides
      # any value still baked in an older dev image.
      CHOKIDAR_USEPOLLING: ""
      WATCHPACK_POLLING: ""
    volumes:
      - ./frontend:/app
      # Named volume shadows the host's frontend/node_modules — the host
      # installs are darwin/arm64 binaries and won't run inside an alpine/linux
      # container, so the container needs its own.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    ports:
      # Host port FRONTEND_PORT (default 3101) so this can coexist with
      # `yarn dev --port 3001` and the usual :3000/:3100 squatters (Grafana
      # LGTM's Loki sits on 3100).
      - "${FRONTEND_PORT:-3101}:3000"

volumes:
  postgres-data:
  frontend-node-modules:
  rustfs-data:
